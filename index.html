<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0e11" />
    <meta name="description" content="Big Bucket: a tipping-bucket water park simulator. Fill it up, ding ding ding, SPLOOSH." />
    <title>Big Bucket</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪣</text></svg>" />
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <span class="brand">🪣 Big&nbsp;Bucket</span>
        <nav id="presets" class="scroller" aria-label="Scenes"></nav>
        <nav id="modes" aria-label="Modes"></nav>
        <nav id="toggles" aria-label="Options"></nav>
      </header>
      <main id="stage">
        <canvas id="canvas2d" aria-label="Water park"></canvas>
        <div id="three-host" hidden></div>
        <div id="hud"></div>
        <aside id="dash" class="panel" hidden></aside>
        <aside id="diffeq" class="panel" hidden><canvas id="plots"></canvas></aside>
        <aside id="designer" class="panel" hidden></aside>
      </main>
      <footer id="controls"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
